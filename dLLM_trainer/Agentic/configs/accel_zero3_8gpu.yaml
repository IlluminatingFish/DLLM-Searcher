compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_multinode_launcher: standard
  zero3_init_flag: true          # 分片加载模型（from_pretrained 在 zero.Init context 下运行）
  zero3_save_16bit_model: true   # 保存时 consolidate 成 bf16
  zero_stage: 3
  offload_optimizer_device: none
  offload_param_device: none
  overlap_comm: false            # 关闭 overlap 防止 NCCL hang
distributed_type: DEEPSPEED
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 8
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
